name: Decommission FORM60 Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create decommissioned site
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 — FORM60</title></head>
          <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#fff;font:16px system-ui,sans-serif">
          <main style="max-width:520px;padding:40px;text-align:center"><h1 style="font-size:64px;margin:0">404</h1><p>Проект FORM60 удалён.</p></main>
          </body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
