services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      DATABASE_URL: sqlite:////data/tracker.db
      WEB_ORIGIN: https://${DOMAIN}
    volumes:
      - tracker_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - "8000"

  bot:
    build:
      context: ./backend
    command: ["python", "-m", "app.bot"]
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: https://${DOMAIN}
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  tracker_data:
  caddy_data:
  caddy_config:
